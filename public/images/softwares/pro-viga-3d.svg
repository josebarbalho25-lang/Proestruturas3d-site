<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Ícone do PROGRAMA — a logo do Pró-Viga (planta + diagrama de momento fletor
       cruzando o eixo), a mesma arte do splash e da tela de ativação. Cantos
       arredondados e glifo centralizado, como o ícone do arquivo .pviga: os dois
       são a mesma família. As coordenadas são as de Fibonacci da logo original;
       bbox do glifo: x 13–87 · y 21–82,5 → centro (50, 51.75). -->
  <defs>
    <linearGradient id="pvigaAppBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2C6B"/>
      <stop offset="1" stop-color="#0A1334"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#pvigaAppBg)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <g transform="translate(50,50) scale(0.72) translate(-50,-51.75)"
     stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="13" y1="55" x2="87" y2="55"/>
    <path d="M 21 21 Q 50 144 79 21"/>
  </g>
</svg>
