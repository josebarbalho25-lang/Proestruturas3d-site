<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Ícone da PFF Calc: o mesmo do instalador (eixo da barra + meia-onda de flambagem),
       na moldura arredondada dos outros programas. -->
  <defs>
    <linearGradient id="pffBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2C6B"/>
      <stop offset="1" stop-color="#0A1334"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#pffBg)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="20" y1="54" x2="80" y2="54"/>
    <path d="M 31 66 C 31 28, 69 28, 69 66"/>
  </g>
</svg>
